<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab L1 · Bản thử nghiệm LookDev 3D (So sánh độc lập)</title>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #dde4ed; color: #0f172a; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; }

    /* Thanh trên gọn nổi trên cảnh 3D */
    .topbar {
      position: fixed; top: 14px; left: 16px; right: 16px; z-index: 20;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      pointer-events: none;
    }
    .bar-group {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(15, 23, 42, 0.1); border-radius: 14px; padding: 6px 8px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      pointer-events: auto;
    }
    .badge {
      font-size: 12px; font-weight: 700; color: #2563eb; background: #eff6ff;
      border: 1px solid #bfdbfe; padding: 5px 10px; border-radius: 9px; letter-spacing: 0.01em;
    }
    .btn {
      appearance: none; border: 1px solid rgba(15, 23, 42, 0.1); background: #fff; color: #1e293b;
      font: 600 12px/1 inherit; padding: 6px 9px; border-radius: 8px; cursor: pointer;
      transition: all 0.15s ease; text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
    }
    .btn:hover { background: #f8fafc; border-color: rgba(37, 99, 235, 0.35); color: #1d4ed8; }
    .btn.is-active { background: #2563eb; color: #fff; border-color: #2563eb; box-shadow: 0 3px 10px rgba(37, 99, 235, 0.28); }
    .btn.is-toggle-on { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    /* Thẻ thông tin trạm ở đáy khung */
    .bottom-card {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 20;
      max-width: 680px; width: calc(100% - 32px);
      background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(15, 23, 42, 0.1); border-radius: 14px; padding: 11px 18px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.1);
      text-align: center;
    }
    .bottom-title { font-size: 12px; font-weight: 700; color: #2563eb; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .bottom-eq { font-size: 16px; font-weight: 800; color: #0f172a; letter-spacing: -0.01em; margin-bottom: 3px; }
    .bottom-desc { font-size: 12.5px; color: #475569; line-height: 1.45; }

    /* Stats nhỏ góc dưới phải */
    .stats {
      position: fixed; bottom: 16px; right: 16px; z-index: 20;
      background: rgba(15, 23, 42, 0.78); color: #e2e8f0; font: 600 11px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 6px 10px; border-radius: 9px; backdrop-filter: blur(6px);
    }

    /* Nhãn dụng cụ 3D có đường dẫn & chấm neo */
    .pro-tags { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
    .pro-tag {
      position: absolute; top: 0; left: 0; pointer-events: auto;
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255, 255, 255, 0.93); color: #0f172a;
      border: 1px solid rgba(15, 23, 42, 0.12); border-radius: 999px;
      padding: 4px 10px; font: 600 12px/1.2 inherit; white-space: nowrap;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12); cursor: default;
    }
    .pro-tag.is-bench { cursor: pointer; padding: 5px 12px; font-weight: 700; }
    .pro-tag.is-bench:hover { background: #2563eb; color: #fff; border-color: #2563eb; }
    .pro-tag i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    .pro-tag em {
      position: absolute; top: 100%; left: calc(50% + var(--dx, 0px));
      width: 1.5px; height: var(--lead, 16px); background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 3px rgba(15, 23, 42, 0.35); pointer-events: none;
    }
    .pro-tag em::after {
      content: ""; position: absolute; bottom: -3.5px; left: -3px;
      width: 7px; height: 7px; border-radius: 50%;
      background: #fff; border: 2px solid #2563eb;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.35);
    }
  </style>
</head>
<body>
  <div id="stage"></div>

  <div class="topbar">
    <div class="bar-group" id="views">
      <span class="badge">LookDev 3D · Lab L1</span>
      <button class="btn is-active" data-v="all">Toàn cảnh (4 bàn)</button>
      <button class="btn" data-v="conc"><span class="dot" style="background:#0891b2"></span>Bàn 1 · Nồng độ</button>
      <button class="btn" data-v="temp"><span class="dot" style="background:#ea580c"></span>Bàn 2 · Nhiệt độ</button>
      <button class="btn" data-v="surf"><span class="dot" style="background:#6366f1"></span>Bàn 3 · Bề mặt</button>
      <button class="btn" data-v="cat"><span class="dot" style="background:#16a34a"></span>Bàn 4 · Xúc tác</button>
      <button class="btn" data-v="lens"><span class="dot" style="background:#2563eb"></span>Vòng kính</button>
    </div>

    <div class="bar-group">
      <button class="btn is-toggle-on" id="btnSim">Đang chạy phản ứng mẫu</button>
      <button class="btn" id="btnBench">Mặt bàn: Đá Epoxy tối S2</button>
      <button class="btn" id="btnTags">Ẩn nhãn</button>
      <button class="btn" id="btnReset">Về góc chuẩn</button>
      <a class="btn" href="./index.html?v=3" target="_blank" title="Mở bản 3 của Claude ở tab mới để so sánh">So với bản v3 ↗</a>
    </div>
  </div>

  <div class="bottom-card">
    <div class="bottom-title" id="bTitle">Toàn cảnh phòng Lab</div>
    <div class="bottom-eq" id="bEq"></div>
    <div class="bottom-desc" id="bDesc"></div>
  </div>

  <div class="stats" id="stats">FPS: --</div>

  <script type="module">
    import { initProLabDemo } from './src/dev/lab_pro_demo.js';

    const viewBtns = [...document.querySelectorAll('#views .btn[data-v]')];
    const bTitle = document.getElementById('bTitle');
    const bEq = document.getElementById('bEq');
    const bDesc = document.getElementById('bDesc');
    const statsEl = document.getElementById('stats');

    const demo = initProLabDemo(document.getElementById('stage'), {
      onViewChange(key, meta) {
        viewBtns.forEach((b) => b.classList.toggle('is-active', b.dataset.v === key));
        bTitle.innerHTML = `<span class="dot" style="background:${meta.color}"></span>${meta.name}`;
        bEq.textContent = meta.eq;
        bDesc.textContent = meta.desc;
      },
      onStats({ fps, calls, tris }) {
        statsEl.textContent = `${fps} FPS · ${calls} draws · ${(tris / 1000).toFixed(1)}k tris`;
      },
    });

    viewBtns.forEach((b) => b.addEventListener('click', () => demo.goView(b.dataset.v)));

    const btnSim = document.getElementById('btnSim');
    btnSim.addEventListener('click', () => {
      const next = !demo.isRunning();
      demo.setRunning(next);
      btnSim.textContent = next ? 'Đang chạy phản ứng mẫu' : 'Chạy phản ứng mẫu';
      btnSim.classList.toggle('is-toggle-on', next);
    });

    const btnBench = document.getElementById('btnBench');
    btnBench.addEventListener('click', () => {
      const next = demo.getBenchTheme() === 'dark' ? 'light' : 'dark';
      demo.setBenchTheme(next);
      btnBench.textContent = next === 'dark' ? 'Mặt bàn: Đá Epoxy tối S2' : 'Mặt bàn: Đá Xám sáng';
    });

    let tagsOn = true;
    const btnTags = document.getElementById('btnTags');
    btnTags.addEventListener('click', () => {
      tagsOn = !tagsOn;
      demo.setShowTags(tagsOn);
      btnTags.textContent = tagsOn ? 'Ẩn nhãn' : 'Hiện nhãn';
    });

    document.getElementById('btnReset').addEventListener('click', () => demo.resetView());
  </script>
</body>
</html>
