<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab Khoa Học · L1 Pro v2 (Visual · UX/UI · Motion · Action)</title>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
  <style>
    @font-face { font-family: "Inter"; src: url("./assets/ds/inter-vietnamese.woff2") format("woff2"); font-weight: 400 800; font-display: swap; unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+1EA0-1EF9; }
    @font-face { font-family: "Inter"; src: url("./assets/ds/inter-latin.woff2") format("woff2"); font-weight: 400 800; font-display: swap; }
    :root {
      --bg: #eef2f7;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-strong: rgba(255, 255, 255, 0.96);
      --border: rgba(15, 23, 42, 0.10);
      --ink: #0f172a;
      --muted: #475569;
      --soft: #64748b;
      --pri: #2563eb;
      --pri-2: #4f46e5;
      --pri-bg: rgba(37, 99, 235, 0.08);
      --ok: #15803d;
      --ok-bg: #ecfdf5;
      --warn: #b45309;
      --warn-bg: #fffbeb;
      --danger: #b91c1c;
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.11), 0 2px 6px rgba(15, 23, 42, 0.05);
      --r: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: "Inter", "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
    #app { display: flex; flex-direction: column; height: 100%; }

    /* ===== HEADER 2 HÀNG SIÊU GỌN (~90px tổng) ===== */
    .p2-head {
      flex: none; z-index: 30;
      background: var(--surface-strong); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 7px 14px 6px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .p2-head-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .p2-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .p2-logo {
      width: 32px; height: 32px; border-radius: 10px; flex: none;
      background: linear-gradient(135deg, #2563eb, #4f46e5); color: #fff;
      display: grid; place-items: center; font-size: 16px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .p2-btitle { font-size: 14px; font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 7px; letter-spacing: -0.015em; }
    .p2-grade { font-size: 10.5px; font-weight: 700; color: var(--pri); background: #eff6ff; border: 1px solid #bfdbfe; padding: 1.5px 7px; border-radius: 999px; }
    .p2-mainq { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p2-mainq b { font-size: 10px; font-weight: 700; color: #fff; background: linear-gradient(90deg, #2563eb, #4f46e5); padding: 1px 7px; border-radius: 999px; flex: none; }

    .p2-tools { display: flex; align-items: center; gap: 5px; flex: none; }
    .p2-tbtn {
      appearance: none; border: 1px solid var(--border); background: #fff; color: var(--ink);
      font: 600 11.5px/1 inherit; padding: 6px 9px; border-radius: 8px; cursor: pointer;
      text-decoration: none; transition: all 0.15s ease; white-space: nowrap;
    }
    .p2-tbtn:hover { border-color: rgba(37, 99, 235, 0.4); color: var(--pri); background: #f8fafc; }
    .p2-tbtn.is-on { background: #eff6ff; color: var(--pri); border-color: #bfdbfe; }

    /* Hàng 2: 10 bước + Chuỗi nhân quả */
    .p2-head-sub { display: flex; align-items: center; justify-content: space-between; gap: 10px; overflow-x: auto; scrollbar-width: none; }
    .p2-head-sub::-webkit-scrollbar { display: none; }
    .p2-steps { display: flex; align-items: center; gap: 4px; flex: none; }
    .p2-step {
      appearance: none; border: 1px solid transparent; background: transparent; color: var(--muted);
      font: 600 11.5px/1 inherit; padding: 4px 8px 4px 5px; border-radius: 999px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px; transition: all 0.15s ease; white-space: nowrap;
    }
    .p2-step i {
      width: 18px; height: 18px; border-radius: 50%; font-style: normal; font-size: 10.5px; font-weight: 700;
      display: grid; place-items: center; background: #e2e8f0; color: #475569; transition: all 0.15s ease;
    }
    .p2-step:hover { background: #f1f5f9; color: var(--ink); }
    .p2-step.is-done i { background: #dcfce7; color: #15803d; }
    .p2-step.is-done { color: #166534; }
    .p2-step.is-cur { background: var(--pri); color: #fff; box-shadow: 0 3px 10px rgba(37, 99, 235, 0.3); }
    .p2-step.is-cur i { background: rgba(255, 255, 255, 0.24); color: #fff; }

    .p2-chain { display: flex; align-items: center; gap: 5px; flex: none; }
    .p2-link {
      font-size: 10.5px; font-weight: 600; color: #94a3b8; background: #f8fafc;
      border: 1px solid #e2e8f0; border-radius: 999px; padding: 3px 8px; white-space: nowrap; transition: all 0.2s ease;
    }
    .p2-link.is-on { color: #1d4ed8; background: #eff6ff; border-color: #93c5fd; font-weight: 700; }
    @media (max-width: 1340px) { .p2-chain { display: none; } }

    /* ===== WORKSPACE 3D PHỦ KÍN + 2 PANEL KÍNH MỜ NỔI ===== */
    .p2-work { position: relative; flex: 1; min-height: 0; overflow: hidden; --safe-l: 22%; --safe-r: 23%; }
    .p2-stage { position: absolute; inset: 0; }
    .p2-stage canvas { display: block; width: 100%; height: 100%; }

    .p2-panel {
      position: absolute; top: 12px; bottom: 12px; z-index: 20;
      width: 296px; max-width: calc(50% - 20px);
      display: flex; flex-direction: column;
      background: var(--surface); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.72); border-radius: var(--r);
      box-shadow: var(--shadow);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease;
    }
    .p2-left { left: 12px; }
    .p2-right { right: 12px; width: 314px; }
    .p2-left.is-closed { transform: translateX(calc(-100% - 18px)); opacity: 0; pointer-events: none; }
    .p2-right.is-closed { transform: translateX(calc(100% + 18px)); opacity: 0; pointer-events: none; }

    /* Nút thu gọn / mở bảng mượt mà */
    .p2-collapse {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 22;
      width: 22px; height: 48px; border: 1px solid var(--border);
      background: var(--surface-strong); color: var(--muted); cursor: pointer;
      font: 700 15px/1 inherit; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.1);
      transition: all 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .p2-collapse:hover { color: var(--pri); background: #fff; }
    .p2-col-l { left: 308px; border-radius: 0 9px 9px 0; border-left: none; }
    .p2-col-l.is-closed { left: 0; }
    .p2-col-r { right: 326px; border-radius: 9px 0 0 9px; border-right: none; }
    .p2-col-r.is-closed { right: 0; }

    .p2-phead {
      flex: none; padding: 10px 14px; border-bottom: 1px solid var(--border);
      display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    }
    .p2-phead b { font-size: 13px; font-weight: 800; letter-spacing: -0.01em; }
    .p2-phead span { font-size: 11px; color: var(--soft); }
    .p2-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; scrollbar-width: thin; }
    .p2-pfoot {
      flex: none; padding: 10px 14px; border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }

    /* Thẻ trái: Bước này */
    .p2-sbadge { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
    .p2-snum {
      width: 22px; height: 22px; border-radius: 50%; background: var(--pri); color: #fff;
      font-size: 11.5px; font-weight: 800; display: grid; place-items: center;
    }
    .p2-stitle { font-size: 12px; font-weight: 700; color: var(--pri); }
    .p2-q { font-size: 15.5px; font-weight: 800; line-height: 1.38; color: var(--ink); letter-spacing: -0.015em; margin-bottom: 10px; }

    .p2-where {
      display: flex; gap: 8px; align-items: flex-start;
      background: rgba(241, 245, 249, 0.8); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; font-size: 12px; line-height: 1.48; color: var(--muted);
    }
    .p2-where i { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex: none; }
    .p2-where b { color: var(--ink); }

    .p2-task {
      background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 11px; padding: 10px 11px; margin-bottom: 10px;
      transition: all 0.2s ease;
    }
    .p2-task.is-done { background: var(--ok-bg); border-color: #a7f3d0; }
    .p2-task-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
    .p2-task-h b { font-size: 12px; font-weight: 800; color: #4338ca; }
    .p2-task.is-done .p2-task-h b { color: #15803d; }
    .p2-pill { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #fff; color: var(--soft); border: 1px solid var(--border); }
    .p2-pill.is-done { background: #16a34a; color: #fff; border-color: #16a34a; }
    .p2-task p { font-size: 12.2px; line-height: 1.5; color: #334155; }

    .p2-concl {
      background: linear-gradient(180deg, #f0fdf4, #ffffff); border: 1px solid #86efac;
      border-radius: 11px; padding: 10px 11px; animation: slideIn 0.25s ease;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .p2-concl b { display: block; font-size: 12px; font-weight: 800; color: #15803d; margin-bottom: 5px; }
    .p2-concl p { font-size: 12.3px; line-height: 1.5; color: var(--ink); margin-bottom: 7px; }
    .p2-ideas { list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 11.8px; line-height: 1.45; color: var(--muted); }
    .p2-ideas li::before { content: "• "; color: #16a34a; font-weight: 800; }
    .p2-ideas li.is-without { color: var(--danger); font-weight: 600; margin-top: 2px; }
    .p2-ideas li.is-without::before { content: "⚠ "; color: var(--danger); }

    /* Cột phải: Hero Readout + Việc sinh đôi + Thanh kéo + Đồ thị + Bảng */
    .p2-read {
      background: linear-gradient(135deg, #f8fafc, #eff6ff); border: 1px solid #dbeafe;
      border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
    }
    .p2-read > span { display: block; font-size: 11px; font-weight: 600; color: var(--soft); margin-bottom: 2px; }
    .p2-read-v { display: flex; align-items: baseline; gap: 5px; font-variant-numeric: tabular-nums; }
    .p2-read-v b { font-size: 28px; font-weight: 800; letter-spacing: -0.025em; color: var(--ink); line-height: 1.05; }
    .p2-read-v em { font-style: normal; font-size: 13px; font-weight: 700; color: var(--pri); }

    .p2-cells { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
    .p2-cell {
      background: #f8fafc; border: 1px solid var(--border); border-radius: 9px; padding: 6px 7px;
      font-variant-numeric: tabular-nums;
    }
    .p2-cell span { display: block; font-size: 10px; color: var(--soft); margin-bottom: 2px; }
    .p2-cell b { font-size: 12.5px; font-weight: 800; color: var(--ink); }

    .p2-sec { margin-bottom: 12px; }
    .p2-sec h3 { font-size: 11.5px; font-weight: 800; color: var(--soft); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 7px; }

    /* Danh sách việc đánh số 1-2-3-4 */
    .p2-proc { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .p2-pstep {
      display: flex; align-items: flex-start; gap: 8px;
      background: #fff; border: 1px solid var(--border); border-radius: 11px; padding: 8px 9px;
      transition: all 0.16s ease;
    }
    .p2-pstep.is-next { border-color: #60a5fa; background: #f8fbff; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12); }
    .p2-pstep.is-3d-hover { border-color: #2563eb; background: #eff6ff; transform: translateX(-2px); }
    .p2-pstep.is-done { background: #f8fafc; border-color: #d1fae5; }
    .p2-pstep.is-lock { opacity: 0.56; }
    .p2-pn {
      width: 22px; height: 22px; border-radius: 50%; flex: none; margin-top: 1px;
      display: grid; place-items: center; font-size: 11px; font-weight: 800;
      background: #e2e8f0; color: #475569;
    }
    .p2-pstep.is-next .p2-pn { background: var(--pri); color: #fff; animation: pulseDot 1.6s infinite; }
    .p2-pstep.is-done .p2-pn { background: #16a34a; color: #fff; }
    @keyframes pulseDot { 0%, 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4); } 60% { box-shadow: 0 0 0 6px rgba(37, 99, 235, 0); } }

    .p2-pb { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .p2-pl { font-size: 12px; font-weight: 700; color: var(--ink); line-height: 1.35; }
    .p2-pstate { font-size: 11.5px; font-weight: 600; color: var(--pri); margin-top: 7px; text-align: center; }

    /* Nút bấm chuẩn */
    .p2-btn {
      appearance: none; border: 1px solid var(--border); background: #fff; color: var(--ink);
      font: 700 12px/1.2 inherit; padding: 7px 11px; border-radius: 9px; cursor: pointer;
      transition: all 0.14s ease; text-align: center;
    }
    .p2-btn:not(.is-pri):not(.is-go):hover:not(:disabled) { border-color: rgba(37, 99, 235, 0.45); color: var(--pri); background: #f8fafc; }
    .p2-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .p2-btn.is-pri { background: linear-gradient(135deg, #2563eb, #4f46e5); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
    .p2-btn.is-pri:hover:not(:disabled) { filter: brightness(1.07); color: #fff; transform: translateY(-0.5px); }
    .p2-btn.is-go { background: #16a34a; color: #fff; border-color: transparent; margin-left: auto; }
    .p2-btn.is-go:hover:not(:disabled) { filter: brightness(1.07); color: #fff; }
    .p2-btn.is-full { width: 100%; }

    .p2-seg { display: flex; gap: 4px; flex-wrap: wrap; }
    .p2-seg button {
      flex: 1; min-width: 56px; appearance: none; border: 1px solid var(--border); background: #f8fafc; color: var(--ink);
      font: 700 11.5px/1 inherit; padding: 7px 6px; border-radius: 8px; cursor: pointer; transition: all 0.14s ease;
    }
    .p2-seg button:hover:not(:disabled) { border-color: var(--pri); color: var(--pri); }
    .p2-seg button.is-on { background: var(--pri); color: #fff; border-color: var(--pri); }
    .p2-seg button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Thanh kéo + ô nhập số mL / g */
    .p2-amt { display: flex; align-items: center; gap: 6px; }
    .p2-range { flex: 1; accent-color: var(--pri); cursor: pointer; }
    .p2-num {
      width: 52px; padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 7px;
      font: 700 12px/1 inherit; text-align: right; color: var(--ink); background: #fff;
    }
    .p2-amt em { font-style: normal; font-size: 11px; font-weight: 700; color: var(--soft); }
    .p2-ends { display: flex; justify-content: space-between; font-size: 10px; color: #94a3b8; margin-top: -3px; }
    .p2-back { appearance: none; border: none; background: none; color: var(--pri); font: 600 11px/1 inherit; cursor: pointer; align-self: flex-start; text-decoration: underline; }

    /* Danh sách chọn bàn bước 1 */
    .p2-tour { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .p2-tour li {
      display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 10px;
      border: 1px solid var(--border); background: #fff; cursor: pointer; transition: all 0.15s ease;
    }
    .p2-tour li:hover, .p2-tour li.is-3d-hover { border-color: rgba(37, 99, 235, 0.55); background: #f8fbff; transform: translateX(-2px); }
    .p2-tour li.is-cur { background: #eff6ff; border-color: #60a5fa; }

    /* Thanh pill chọn nhanh từng bàn / góc nhìn nổi trên đỉnh vùng 3D */
    .p2-quickbar {
      position: absolute; top: 12px; left: calc(var(--safe-l) + (100% - var(--safe-l) - var(--safe-r)) / 2);
      transform: translateX(-50%); z-index: 19;
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: center;
      max-width: calc(100% - var(--safe-l) - var(--safe-r) - 24px);
    }
    .p2-quickbar:empty { display: none; }
    .p2-qbtn {
      appearance: none; border: 1px solid rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      color: var(--ink); font: 700 11.5px/1 inherit; padding: 6px 10px; border-radius: 999px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12); transition: all 0.15s ease; white-space: nowrap;
    }
    .p2-qbtn i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    .p2-qbtn:hover { background: #fff; border-color: rgba(37, 99, 235, 0.45); color: var(--pri); transform: translateY(-1px); }
    .p2-qbtn.is-done { color: #166534; }
    .p2-qbtn.is-on { background: var(--pri); color: #fff; border-color: var(--pri); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.32); }
    .p2-qbtn.is-on i { background: #fff !important; }
    .p2-tck {
      width: 24px; height: 24px; border-radius: 8px; flex: none; display: grid; place-items: center;
      font-size: 12px; font-weight: 800; background: color-mix(in srgb, var(--c) 14%, #fff); color: var(--c);
    }
    .p2-tour li.is-done .p2-tck { background: #16a34a; color: #fff; }
    .p2-tour b { display: block; font-size: 12.5px; font-weight: 800; color: var(--ink); }
    .p2-tour small { display: block; font-size: 11px; color: var(--soft); line-height: 1.3; }

    /* Công tắc bước 7 (Vòng kính) */
    .p2-swrow {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 9px 11px; border-radius: 10px; border: 1px solid var(--border); background: #fff;
      margin-bottom: 6px; cursor: pointer; transition: all 0.15s ease;
    }
    .p2-swrow.is-on { background: #eff6ff; border-color: #93c5fd; }
    .p2-swrow b { display: block; font-size: 12.5px; font-weight: 700; }
    .p2-swrow small { font-size: 11px; color: var(--soft); }
    .p2-swrow input { width: 18px; height: 18px; accent-color: var(--pri); cursor: pointer; }

    /* Đồ thị & Bảng kết quả */
    .p2-svg { width: 100%; height: auto; display: block; background: #fff; border: 1px solid var(--border); border-radius: 10px; }
    .p2-empty { font-size: 11.5px; color: var(--soft); background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 9px; padding: 9px; line-height: 1.45; }
    .p2-table { width: 100%; border-collapse: collapse; font-size: 11px; background: #fff; border-radius: 9px; overflow: hidden; border: 1px solid var(--border); font-variant-numeric: tabular-nums; }
    .p2-table th { background: #f1f5f9; color: var(--muted); font-weight: 700; text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--border); }
    .p2-table td { padding: 6px 6px; border-bottom: 1px solid #f1f5f9; color: var(--ink); }
    .p2-table tr.is-new td { background: #eff6ff; font-weight: 700; }

    /* ===== OVERLAY GIỮA CẢNH 3D (PHƯƠNG TRÌNH, TOAST, RESET, NHÃN, TOOLTIP) ===== */
    .p2-eq {
      position: absolute; bottom: 14px; left: calc(var(--safe-l) + (100% - var(--safe-l) - var(--safe-r)) / 2);
      transform: translateX(-50%); z-index: 15;
      background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.85); border-radius: 13px; padding: 8px 18px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.14); text-align: center; max-width: min(560px, calc(100% - var(--safe-l) - var(--safe-r) - 24px));
      transition: all 0.25s ease;
    }
    .p2-eq.is-warn { background: #fffbeb; border-color: #f59e0b; }
    .p2-eq small { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--muted); }
    .p2-eq small i { width: 7px; height: 7px; border-radius: 50%; }
    .p2-eq b { display: block; font-size: 16.5px; font-weight: 800; color: var(--ink); margin: 1px 0; letter-spacing: -0.01em; }
    .p2-eq em { display: block; font-style: normal; font-size: 11.5px; color: var(--soft); }
    .p2-eq.is-warn em { color: #b45309; font-weight: 700; }

    .p2-toast {
      position: absolute; top: 52px; left: calc(var(--safe-l) + (100% - var(--safe-l) - var(--safe-r)) / 2);
      transform: translateX(-50%); z-index: 25;
      background: rgba(15, 23, 42, 0.88); color: #fff; backdrop-filter: blur(10px);
      font-size: 12.5px; font-weight: 600; padding: 8px 15px; border-radius: 999px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.22); max-width: 540px; text-align: center;
      animation: slideIn 0.2s ease;
    }
    .p2-toast[data-tone="success"] { background: #15803d; }

    .p2-reset-cam {
      position: absolute; top: 52px; right: calc(var(--safe-r) + 12px); z-index: 18;
      appearance: none; border: 1px solid var(--border); background: rgba(255, 255, 255, 0.92);
      color: var(--ink); font: 700 11.5px/1 inherit; padding: 7px 11px; border-radius: 999px;
      cursor: pointer; box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12); transition: all 0.15s ease;
    }
    .p2-reset-cam:hover { background: var(--pri); color: #fff; border-color: var(--pri); }

    .p2-stats {
      position: absolute; bottom: 10px; right: calc(var(--safe-r) + 10px); z-index: 12;
      background: rgba(15, 23, 42, 0.58); color: #e2e8f0; backdrop-filter: blur(6px);
      font: 600 9.5px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 3px 7px; border-radius: 6px;
      pointer-events: none;
    }

    /* Nhãn 3D có đường dẫn mảnh */
    .p2-tags { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
    .p2-tag {
      position: absolute; top: 0; left: 0; pointer-events: auto;
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(255, 255, 255, 0.93); color: var(--ink);
      border: 1px solid rgba(15, 23, 42, 0.12); border-radius: 999px;
      padding: 3.5px 9px; font: 600 11.5px/1.2 inherit; white-space: nowrap;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.12); cursor: pointer;
    }
    .p2-tag.is-bench { padding: 5px 11px; font-weight: 800; }
    .p2-tag:hover { background: var(--pri); color: #fff; border-color: var(--pri); }
    .p2-tag i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    .p2-tag em {
      position: absolute; top: 100%; left: calc(50% + var(--dx, 0px));
      width: 1.5px; height: var(--lead, 16px); background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 3px rgba(15, 23, 42, 0.35); pointer-events: none;
    }
    .p2-tag em::after {
      content: ""; position: absolute; bottom: -3.5px; left: -3px; width: 7px; height: 7px; border-radius: 50%;
      background: #fff; border: 2px solid var(--pri);
    }

    .p2-tip {
      position: absolute; top: 0; left: 0; z-index: 30; pointer-events: none;
      background: rgba(15, 23, 42, 0.9); color: #fff; font: 600 11.5px/1.2 inherit;
      padding: 6px 10px; border-radius: 8px; box-shadow: 0 6px 18px rgba(15, 23, 42, 0.25); white-space: nowrap;
    }

    /* ===== FOOTER GỌN ===== */
    .p2-foot {
      flex: none; z-index: 30; background: var(--surface-strong); border-top: 1px solid var(--border);
      padding: 7px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .p2-fmid { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .p2-fcount { font-size: 12px; font-weight: 800; color: var(--ink); }
    .p2-fnote { font-size: 10.5px; color: #94a3b8; }
    .p2-fbtn {
      appearance: none; border: 1px solid var(--border); background: #fff; color: var(--ink);
      font: 700 12px/1 inherit; padding: 8px 14px; border-radius: 999px; cursor: pointer; transition: all 0.14s ease;
    }
    .p2-fbtn:hover:not(:disabled) { border-color: var(--pri); color: var(--pri); }
    .p2-fbtn:disabled { opacity: 0.4; cursor: not-allowed; }
    .p2-fbtn.is-pri { background: linear-gradient(135deg, #2563eb, #4f46e5); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
    .p2-fbtn.is-pri:hover:not(:disabled) { filter: brightness(1.06); color: #fff; }
  </style>
