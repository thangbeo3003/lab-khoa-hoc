<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản thử 2D có chiều sâu · Lab Khoa Học</title>
<style>
  :root { --ink:#14223a; --mut:#5a6b80; --line:#dfe5ec; --blue:#2f6fd0; --bg:#f4f6f9; }
  * { box-sizing:border-box; } html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; display:flex; flex-direction:column; }
  header { display:flex; align-items:baseline; gap:16px; padding:12px 20px 8px; }
  header h1 { font-size:20px; margin:0; } header p { margin:0; color:var(--mut); flex:1; }
  header button { font:inherit; padding:6px 14px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); cursor:pointer; }
  #wrap { flex:1; min-height:0; margin:0 20px; border-radius:12px; overflow:hidden; background:#20262e; position:relative; }
  #cv { width:100%; height:100%; display:block; cursor:default; }
  #result { margin:10px 20px 14px; min-height:54px; padding:10px 16px; background:#fff; border:1px solid var(--line); border-radius:10px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  #result .seen { color:#0a7a4b; font-weight:700; } #result .eq { font-size:22px; font-weight:700; } #result .why { color:var(--mut); flex:1; min-width:240px; }
  #result:empty::before { content:"Kết quả sẽ hiện ở đây: thấy gì, phương trình, vì sao."; color:var(--mut); }
</style>
</head>
<body>
  <header><h1>Bàn thí nghiệm · bản thử 2D có chiều sâu</h1><p id="hint"></p><button id="bReset">Làm lại</button></header>
  <div id="wrap"><canvas id="cv"></canvas></div>
  <div id="result"></div>
  <script type="module" src="./src/flat/scene.js"></script>
</body>
</html>
