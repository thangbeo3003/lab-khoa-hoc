<!doctype html>
<html lang="vi" data-font="plex">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài học 2D · bản thử</title>
<link rel="icon" href="data:,">
<!-- Trang thử bộ máy 2D của bài học (25/11): nạp giáo án bài 3 (Tốc độ phản ứng), dựng MỘT bàn bằng src/flat/labset2d.js.
     ?ban=surf (mặc định) | conc | temp | cat. Danh sách việc bên phải lấy thẳng từ bench.steps qua lab.proc(). Chưa phải giao diện chính. -->
<style>
  @font-face { font-family:'IBM Plex Sans'; font-weight:400; src:url(./assets/ds/IBMPlexSans-Regular.woff2) format('woff2'); }
  @font-face { font-family:'IBM Plex Sans'; font-weight:500; src:url(./assets/ds/IBMPlexSans-Medium.woff2) format('woff2'); }
  @font-face { font-family:'IBM Plex Sans'; font-weight:600; src:url(./assets/ds/IBMPlexSans-SemiBold.woff2) format('woff2'); }
  @font-face { font-family:'IBM Plex Mono'; font-weight:500; src:url(./assets/ds/IBMPlexMono-Medium.woff2) format('woff2'); }
  :root { --bg:#f7f7fb; --line:#e7e6ee; --ink:#090a2b; --muted:#666878; --acc:#6254f4; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:400 14px/1.45 'IBM Plex Sans', system-ui, sans-serif; height:100vh; display:grid; grid-template-rows:auto 1fr; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  header h1 { margin:0; font-size:17px; font-weight:600; }
  header .eq { color:var(--muted); }
  main { min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 340px; }
  #stage { position:relative; min-height:0; }
  aside { border-left:1px solid var(--line); background:#fff; padding:12px; overflow:auto; display:flex; flex-direction:column; gap:10px; }
  .cond { color:var(--muted); font-size:13px; }
  ol { margin:0; padding:0; list-style:none; display:grid; gap:6px; }
  li { border:1px solid var(--line); border-radius:12px; padding:8px 10px; }
  li.next { border-color:var(--acc); background:#eeecff; }
  li.done .lbl::before { content:'✓ '; color:#14624f; font-weight:600; }
  .lbl { font-weight:500; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; align-items:center; }
  button { font:inherit; font-weight:500; border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 12px; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  button.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  input[type=number] { width:80px; font:500 13px 'IBM Plex Mono', monospace; padding:4px 6px; border:1px solid #8b89a1; border-radius:8px; }
  .read { border:1px solid var(--line); border-radius:12px; padding:8px 10px; }
  .read .big { font:500 26px 'IBM Plex Mono', monospace; }
  .read table { width:100%; font-size:13px; border-collapse:collapse; } .read td { padding:2px 0; } .read td + td { text-align:right; font-family:'IBM Plex Mono', monospace; }
  #say { min-height:40px; font-size:13px; color:#3a2a05; background:#fff7e0; border-radius:10px; padding:6px 10px; }
  #rows { font-size:12.5px; } #rows div { border-top:1px solid var(--line); padding:4px 0; }
  @media (max-width:820px) { main { grid-template-columns:1fr; grid-template-rows:55vh auto; } aside { border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<header><h1 id="title">Bài học 2D</h1><span class="eq" id="eq"></span></header>
<main>
  <div id="stage"></div>
  <aside>
    <div class="cond" id="cond"></div>
    <ol id="steps"></ol>
    <div class="row"><button id="rinse"></button></div>
    <div class="read" id="read"></div>
    <div id="say" aria-live="polite"></div>
    <div id="rows"></div>
  </aside>
</main>
<script type="module">
import { lab } from './src/lessons/h10_toc_do_phan_ung_03/giao_an.js';
import { createLab2d } from './src/flat/labset2d.js';
const id = new URLSearchParams(location.search).get('ban') || 'surf';
const L = createLab2d(document.getElementById('stage'), lab, { bench: id });
const B = L.benches[id], d = B.d, $ = (x) => document.getElementById(x);
window.__lab2d = L;
$('title').textContent = d.name + ' · bản 2D (thử)'; $('eq').textContent = d.eq || '';
const say = (t) => { $('say').textContent = t; };
L.on('say', say);
L.on('mark', (bid, m) => m.say && say(m.say));
L.on('done', (bid, row) => { if (!row) return; const el = document.createElement('div'); el.textContent = `${row.cond}: ${d.cols[1]} ${row.exp} · ${d.cols[2]} ${row.ref} · ${d.cols[3]} ${row.ratio}`; $('rows').prepend(el); });
function panel() {
  const P = L.proc(id); if (!P) return;
  const ol = $('steps'); ol.replaceChildren(...P.steps.map((s) => {
    const li = document.createElement('li'); li.className = (s.next ? 'next ' : '') + (s.done ? 'done' : '');
    const lbl = document.createElement('div'); lbl.className = 'lbl'; lbl.textContent = `${s.n}. ${s.label}`; li.append(lbl);
    const row = document.createElement('div'); row.className = 'row';
    if (s.options) s.options.forEach((o) => { const b = document.createElement('button'); b.textContent = o.label; b.className = o.on ? 'on' : ''; b.disabled = !s.can; b.onclick = () => L.act(id, s.id, o.k); row.append(b); });
    else if (s.range) { const inp = document.createElement('input'); inp.type = 'number'; inp.min = s.range.min; inp.max = s.range.max; inp.step = s.range.step; inp.value = String(s.range.want); inp.setAttribute('aria-label', s.label);
      inp.onchange = () => { inp.value = String(L.setWant(id, s.id, Number(inp.value))); };
      const u = document.createElement('span'); u.textContent = s.range.unit + (s.range.per || '');
      const b = document.createElement('button'); b.textContent = s.range.act || 'Làm'; b.disabled = !s.can; b.onclick = () => { L.setWant(id, s.id, Number(inp.value)); L.act(id, s.id); };
      row.append(inp, u, b); }
    else { const b = document.createElement('button'); b.textContent = 'Làm'; b.disabled = !s.can; b.onclick = () => L.act(id, s.id); row.append(b); }
    li.append(row); return li; }));
  const r = $('rinse'); if (P.rinse) { r.hidden = false; r.textContent = P.rinse.label; r.disabled = !P.rinse.can; r.className = P.rinse.next ? 'on' : ''; } else r.hidden = true;
  live();
}
// Số trên bảng đọc và dòng điều kiện chạy theo thời gian; danh sách việc chỉ dựng lại khi bàn đổi trạng thái (để nút và ô nhập không bị thay giữa lúc bấm)
function live() {
  $('cond').textContent = typeof d.cond === 'function' ? d.cond(B) : d.cond || '';
  const R = d.chem && d.chem.read ? d.chem.read(B) : null;
  if (R) $('read').innerHTML = `<div>${R.label}</div><div class="big">${R.big} <small>${R.unit}</small></div><table>${R.cells.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table>`;
}
$('rinse').onclick = () => L.rinse(id);
L.on('change', panel);
let k = 0, busy = null; (function tick() { if (++k % 6 === 0) { live(); const b = L.proc(id).busy; if (b !== busy) { busy = b; panel(); } } requestAnimationFrame(tick); })();
panel();
</script>
</body>
</html>
